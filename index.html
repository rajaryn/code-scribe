<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScribe | Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="background-noise"></div>
    <div class="background-glow"></div>

    <main class="main-container">
        <div class="header-section">
            <h1 class="main-title">
                Start <span class="title-accent">building.</span>
            </h1>
        </div>

        <div id="input-wrapper" class="input-wrapper">
            <div id="glow-border" class="glow-border"></div>

            <div class="input-container">
                <textarea 
                    id="chat-textarea"
                    placeholder="Describe your app..." 
                    class="chat-textarea"
                    rows="1"
                ></textarea>

                <div class="controls-row">
                    <div class="controls-left d-flex gap-1 align-items-center">
                        <button class="btn-icon" title="Add Context">
                            <i data-lucide="paperclip" class="icon-size"></i>
                        </button>
                        
                        <button id="math-mode-btn" class="btn-icon btn-math-toggle" title="Toggle LaTeX Mode">
                            <i data-lucide="sigma" class="icon-size"></i>
                            <span class="mode-label">Math</span>
                        </button>
                    </div>

                    <div class="controls-right">
                        <div id="voice-interface" class="voice-interface">
                            <span id="recording-timer" class="recording-timer">00:00</span>
                            <div id="visualizer-bars" class="visualizer-container mask-gradient">
                                </div>
                        </div>

                        <button id="mic-btn" class="btn-mic">
                            <div id="mic-ring" class="mic-ring"></div>
                            <i data-lucide="mic" id="mic-icon" class="icon-size mic-icon"></i>
                        </button>

                        <button id="send-btn" disabled class="btn-send">
                            <i data-lucide="arrow-up" class="icon-size icon-send"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="status-msg" class="status-msg">
                Listening...
            </div>
        </div>
        <div class="container project-picker-section mt-5 pb-5">
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <h2 class="section-title">Recent <span class="title-accent">Projects</span></h2>
                <div class="project-meta">
                    <span class="badge bg-dark border border-secondary">
                        Total: <span id="project-count">0</span>
                    </span>
                </div>
            </div>

            <div id="home-project-grid" class="row g-4">
                <div class="col-12 text-center py-5 text-secondary opacity-50">
                    <i data-lucide="loader-2" class="spin mb-2"></i>
                    <p>Loading your workspace...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
