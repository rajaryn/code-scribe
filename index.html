<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolt Style Chat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#09090b',
                        surface: '#18181b',
                        border: 'rgba(255,255,255,0.08)',
                        accent: '#ff3333', /* Recording Red */
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-white h-screen w-full flex flex-col items-center justify-center overflow-hidden antialiased selection:bg-accent/20">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 opacity-[0.04]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22 opacity=%221%22/%3E%3C/svg%3E');"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[120vw] h-[50vh] bg-gradient-to-t from-white/[0.03] to-transparent blur-3xl"></div>
    </div>

    <main class="relative z-10 w-full max-w-[700px] px-4 sm:px-6 flex flex-col gap-8">
        
        <div class="text-center space-y-2">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
                Start <span class="text-white/40 italic">building.</span>
            </h1>
        </div>

        <div id="input-wrapper" class="group relative w-full">
            <div id="glow-border" class="absolute -inset-[1px] rounded-2xl bg-gradient-to-b from-white/20 to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100 pointer-events-none"></div>

            <div class="relative flex flex-col rounded-2xl bg-surface border border-white/10 shadow-2xl transition-all duration-300 focus-within:border-white/20 overflow-hidden">
                
                <textarea 
                    id="chat-textarea"
                    placeholder="Describe your app..." 
                    class="w-full bg-transparent text-[16px] leading-relaxed text-white placeholder-white/30 px-5 pt-5 pb-2 focus:outline-none resize-none font-sans min-h-[60px] max-h-[400px]"
                    rows="1"
                ></textarea>

                <div class="flex items-center justify-between px-3 pb-3 pt-2 h-[50px]">
                    
                    <button class="p-2 rounded-lg text-white/40 hover:text-white hover:bg-white/5 transition-all active:scale-95" title="Add Context">
                        <i data-lucide="paperclip" class="size-4"></i>
                    </button>

                    <div class="flex items-center gap-4">
                        
                        <div id="voice-interface" class="hidden items-center gap-3">
                            <span id="recording-timer" class="font-mono text-xs text-accent tabular-nums tracking-wider">00:00</span>
                            
                            <div id="visualizer-bars" class="flex items-center justify-end gap-[2px] h-6 w-24 overflow-hidden mask-gradient">
                                </div>
                        </div>

                        <button id="mic-btn" class="relative group/mic flex items-center justify-center size-9 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/10 transition-all duration-300 overflow-visible">
                            <div id="mic-ring" class="absolute inset-0 rounded-full border border-accent opacity-0 scale-75 transition-all duration-300"></div>
                            <i data-lucide="mic" id="mic-icon" class="size-4 text-white/60 transition-colors duration-300 group-hover/mic:text-white"></i>
                        </button>

                        <button id="send-btn" disabled class="hidden sm:flex items-center justify-center size-9 rounded-full bg-white text-black disabled:opacity-0 disabled:scale-75 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg shadow-white/10">
                            <i data-lucide="arrow-up" class="size-4 stroke-[3px]"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="status-msg" class="absolute -bottom-8 left-0 w-full text-center text-xs font-mono text-white/30 opacity-0 transition-opacity duration-300">
                Listening...
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
